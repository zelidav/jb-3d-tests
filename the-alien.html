<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg-top:#f4f4f6;--bg-bottom:#cfd0d6;--text:#1d1d22;--muted:#5d5d66}

body{background:var(--bg-bottom);background-image:radial-gradient(ellipse at 50% 35%,var(--bg-top) 0%,var(--bg-bottom) 80%);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:absolute;top:0;left:0;right:0;padding:14px 16px 0;text-align:center;pointer-events:none;z-index:2}

canvas{display:block;width:100vw;height:100vh;touch-action:none}
.bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.16);z-index:3;max-width:calc(100vw - 24px)}

</style>
<script>window.PIECE_TEX={};window.PIECE={"height": 127.0, "width": 36.0, "exposure": 1.0, "outer": [[1.0, 7], [0.99, 9.5], [0.975, 12.3], [0.955, 14.8], [0.93, 16.6], [0.9, 17.6], [0.86, 18], [0.82, 17.6], [0.79, 16.6], [0.765, 14.8], [0.745, 12.4], [0.73, 9.8], [0.718, 7.6], [0.708, 6.8], [0.69, 6.45], [0.3, 6.35], [0.08, 6.35], [0.01, 6.4], [0.003, 6.2], [0.0, 5.9]], "lipIn": 5.3, "glass": {"atten": "#ffffff", "attenDist": 60, "edge": "#22a01c", "edgeK": 0.75, "grad": [[0, "#5cff4a"], [0.67, "#4cf03c"], [0.71, "#c8ffc0"], [0.76, "#eef0ff"], [0.9, "#dcd6ff"], [1, "#c9c0ff"]], "glow": [[0, "#1d8c12"], [0.67, "#1d8c12"], [0.72, "#000000"], [1, "#000000"]], "glowK": 0.55}, "collar": {"f0": 0.008, "f1": 0.07, "r": 6.5, "photo": null, "lines": 34, "lineW": 2.5, "seed": 11, "lineCols": ["rgba(30,210,40,.95)", "rgba(15,90,25,.9)", "rgba(60,240,60,.9)"], "lumps": 10, "lumpColor": "#c8ffbc", "lumpOpacity": 0.4, "lumpR": 0.95, "wrapOpacity": 0.95}, "marbles": [{"f": 0.508, "deg": 8, "dia": 3.8, "color": "#b8ffb0", "opacity": 0.55}, {"f": 0.583, "deg": 78, "dia": 4.6, "color": "#b8ffb0", "opacity": 0.55}], "loops": [{"f": 0.63, "deg": -45, "R": 3.2, "tube": 0.65, "color": "#c8ffc0"}], "stem": {"deg": 0, "f": 0.864, "out": 14.4, "stemColor": "#e2f6e2", "jointColor": "#c4ecbc", "bowl": null}};</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<header><h1>The Alien, giant (3D test)</h1><p>Double-tap to zoom in, pinch to get closer.</p></header>
<nav class="bar" aria-label="Zoom controls"><button type="button" class="ic" id="zIn" aria-label="Zoom in">+</button><button type="button" class="ic" id="zOut" aria-label="Zoom out">&minus;</button><button type="button" class="ic" id="zReset" aria-label="Reset view">&#x21BA;</button><span class="sep"></span><button type="button" data-spot="marbles">Bumps</button><button type="button" data-spot="crown">Collar</button><button type="button" data-spot="bowl">Joint</button></nav>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Generated by jbsite-work/glass/3d/build3d.py: a lathe body from the measured profile, the collar photo mapped once
// on the front blended into a drawn wrap, and each marble's own close-up photo mapped onto its face.
const C = window.PIECE, T = window.PIECE_TEX;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = C.exposure || 1.05;
renderer.shadowMap.enabled = true;
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.background = new THREE.Color(0xeeeef2);

// units: cm. f = height from the top of the piece (0) to the foot (1); radii in cm.
const H = C.height, Y = (f) => (1 - f) * H;
const piece = new THREE.Group(); scene.add(piece);
const tex = (src) => { const t = new THREE.TextureLoader().load(src); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const col = (c) => new THREE.Color(c);
const glass = (o = {}) => new THREE.MeshPhysicalMaterial(Object.assign({
  color: 0xffffff, metalness: 0, roughness: 0.04, transparent: true, opacity: 0.55, depthWrite: false,
  clearcoat: 1, clearcoatRoughness: 0.02, specularIntensity: 1, envMapIntensity: 1.6, side: THREE.DoubleSide }, o));
function gradTex(stops, w = 8, h = 512) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), lg = g.createLinearGradient(0, 0, 0, h);
  stops.forEach(([p, cl]) => lg.addColorStop(p, cl));
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const edge = (geo, cl, op) => {
  const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false,
    uniforms: { c: { value: new THREE.Color(cl) }, k: { value: op } },
    vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'uniform vec3 c; uniform float k; varying vec3 vN; varying vec3 vV; void main(){ float r = 1. - abs(dot(normalize(vN), normalize(vV))); gl_FragColor = vec4(c, k * pow(r, 2.2)); }' });
  return new THREE.Mesh(geo, mat); };

// outer radius at height f. C.outer runs foot (f=1) to top (f=0); the lip turns in to C.lipIn.
const OUT = C.outer.slice().sort((a, b) => a[0] - b[0]);
function rAt(f) {
  for (let i = 0; i < OUT.length - 1; i++) { const [f0, r0] = OUT[i], [f1, r1] = OUT[i + 1]; if (f >= f0 && f <= f1) return f1 === f0 ? r0 : r0 + (r1 - r0) * (f - f0) / (f1 - f0); }
  return OUT[OUT.length - 1][1];
}

// one lathe for the whole body: foot centre, the outside up to the lip, then a little way back down inside
const pts = [[1, 0], ...C.outer, [0, C.lipIn], [0.01, C.lipIn * 0.98]].map(([f, r]) => new THREE.Vector2(Math.max(0.001, r), Y(f)));
const bodyGeo = new THREE.LatheGeometry(pts, 160);
{ const p = bodyGeo.attributes.position, uv = bodyGeo.attributes.uv; for (let i = 0; i < p.count; i++) uv.setY(i, p.getY(i) / H); }
const G = C.glass;
const bodyMat = new THREE.MeshPhysicalMaterial({ color: G.grad ? 0xffffff : col(G.color), metalness: 0, roughness: 0.03, transmission: 1, thickness: G.thickness || 1.2, ior: 1.5,
  attenuationColor: col(G.atten), attenuationDistance: G.attenDist, clearcoat: 1, clearcoatRoughness: 0.02, specularIntensity: 1,
  envMapIntensity: 1.1, side: THREE.DoubleSide });
// grad / glow stops are [f, colour] (f = 0 at the top): the canvas top lands at uv.y = 1, the top of the piece
if (G.grad) bodyMat.map = gradTex(G.grad);
if (G.glow) { bodyMat.emissive = col(0xffffff); bodyMat.emissiveMap = gradTex(G.glow); bodyMat.emissiveIntensity = G.glowK || 0.4; }
const body = new THREE.Mesh(bodyGeo, bodyMat); body.castShadow = true; piece.add(body);
{ const e = edge(bodyGeo, col(G.edge), G.edgeK || 0.9); e.scale.set(1.004, 1, 1.004); piece.add(e); }

// the collar
const K = C.collar, bandH = (K.f1 - K.f0) * H, bandY = Y((K.f0 + K.f1) / 2), bandR = K.r;
function fadeTex() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 4;
  const g = c.getContext('2d'), lg = g.createLinearGradient(0, 0, 256, 0);
  lg.addColorStop(0, '#000'); lg.addColorStop(0.22, '#fff'); lg.addColorStop(0.78, '#fff'); lg.addColorStop(1, '#000');
  g.fillStyle = lg; g.fillRect(0, 0, 256, 4); return new THREE.CanvasTexture(c);
}
function wrapTex() {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 512;
  const g = c.getContext('2d'); let s = K.seed || 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < (K.lines || 26); i++) {
    g.strokeStyle = K.lineCols[i % K.lineCols.length]; g.lineWidth = (K.lineW || 2) + rnd() * 2;
    const y0 = 30 + rnd() * 450, tilt = (rnd() - .5) * 110; g.beginPath(); g.moveTo(0, y0);
    g.bezierCurveTo(680, y0 + tilt * 0.6 + (rnd() - .5) * 40, 1360, y0 + tilt * 0.3 + (rnd() - .5) * 40, 2048, y0); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const back = new THREE.Mesh(new THREE.CylinderGeometry(bandR - 0.06, bandR - 0.06, bandH, 128, 1, true),
  new THREE.MeshPhysicalMaterial({ map: wrapTex(), color: 0xffffff, transparent: true, opacity: K.wrapOpacity || 0.9, roughness: 0.1, clearcoat: 1, depthWrite: false, side: THREE.DoubleSide }));
back.position.y = bandY; piece.add(back);
if (K.photo) {
  const front = new THREE.Mesh(new THREE.CylinderGeometry(bandR, bandR, bandH, 96, 1, true, -Math.PI / 2, Math.PI),
    new THREE.MeshPhysicalMaterial({ map: tex(T[K.photo]), alphaMap: fadeTex(), roughness: 0.08, clearcoat: 1, transparent: true, opacity: 0.9, depthWrite: false, envMapIntensity: 1.1, side: THREE.DoubleSide }));
  front.position.y = bandY; front.renderOrder = 2; piece.add(front);
}
// clear lumps on the wrap (behind the photo only, or all the way round when there is no photo)
{
  const lump = glass({ color: col(K.lumpColor || 0xf6efff), opacity: K.lumpOpacity || 0.3 });
  const n = K.lumps || 5, from = K.photo ? Math.PI / 2 : 0, span = K.photo ? Math.PI : 2 * Math.PI;
  for (let i = 0; i < n; i++) {
    const a = from + (i + 0.5) / n * span, y = bandY + (i % 2 ? 0.25 : -0.2) * bandH;
    const m = new THREE.Mesh(new THREE.SphereGeometry(K.lumpR || 1.0, 32, 24), lump);
    m.scale.set(1.4, 1, 0.8); m.position.set(Math.sin(a) * (bandR + 0.5), y, Math.cos(a) * (bandR + 0.5)); m.lookAt(0, y, 0); piece.add(m);
  }
}

// marbles: each one's own close-up photo mapped onto its face. angle: 0 = front, + = to the viewer's right.
const MARB = [];
for (const M of C.marbles) {
  const a = THREE.MathUtils.degToRad(M.deg), y = Y(M.f), r = rAt(M.f), dia = M.dia;
  const g = new THREE.SphereGeometry(dia / 2, 64, 48);
  let mat;
  if (M.tex) {
    const p = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / dia + 0.5, p.getY(i) / dia + 0.5);
    mat = new THREE.MeshPhysicalMaterial({ map: tex(T[M.tex]), roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.01, envMapIntensity: 1.2 });
  } else {
    mat = glass({ color: col(M.color || 0xffffff), opacity: M.opacity || 0.35 });
  }
  const m = new THREE.Mesh(g, mat);
  const out = r + dia * (M.out ?? 0.38);
  m.position.set(Math.sin(a) * out, y, Math.cos(a) * out);
  m.lookAt(Math.sin(a) * 400, y, Math.cos(a) * 400);
  if (M.spin) m.rotateZ(THREE.MathUtils.degToRad(M.spin));
  if (M.sy) m.scale.set(1, M.sy, 1);
  m.castShadow = true; piece.add(m); if (!M.noSpot) MARB.push(m.position.clone());
}
// pushed-in pockets and applied drops
for (const D of C.dimples || []) {
  const a = THREE.MathUtils.degToRad(D.deg), y = Y(D.f), r = rAt(D.f) + (D.out || 0);
  const d = new THREE.Mesh(new THREE.SphereGeometry(D.size || 1.4, 32, 24), glass({ color: col(D.color), opacity: D.opacity || 0.4 }));
  d.scale.set(...(D.scale || [0.7, 1.3, 0.35])); d.position.set(Math.sin(a) * r, y, Math.cos(a) * r); d.lookAt(0, y, 0); piece.add(d);
}
// a clear loop worked onto the neck, standing out from the glass (The Alien)
for (const L of C.loops || []) {
  const a = THREE.MathUtils.degToRad(L.deg), y = Y(L.f), r = rAt(L.f);
  const grp = new THREE.Group(); grp.rotation.y = a; grp.position.y = y; piece.add(grp);
  const t = new THREE.Mesh(new THREE.TorusGeometry(L.R, L.tube, 24, 72), glass({ color: col(L.color || 0xffffff), opacity: 0.45 }));
  t.rotation.y = Math.PI / 2; t.position.z = r + L.R * 0.35; grp.add(t);
}

// downstem + joint (+ bowl): out of the bulb at an angle, tilted 45 degrees
const S = C.stem;
const stemPivot = new THREE.Group(); stemPivot.rotation.y = THREE.MathUtils.degToRad(S.deg) - Math.PI / 2; piece.add(stemPivot);
const stem = new THREE.Group(); stemPivot.add(stem);
stem.position.set(S.out, Y(S.f), 0); stem.rotation.z = -Math.PI / 4 + (S.tilt || 0);
const st = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 22, 48, 1, false), new THREE.MeshPhysicalMaterial({ color: col(S.stemColor), roughness: 0.1, clearcoat: 1, transparent: true, opacity: 0.75 }));
st.position.y = -7; stem.add(st);
const joint = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.0, 3.4, 48, 1, !S.bowl), new THREE.MeshPhysicalMaterial({ color: col(S.jointColor), roughness: 0.2, clearcoat: 1, transparent: !S.bowl, opacity: S.bowl ? 1 : 0.7, side: THREE.DoubleSide }));
joint.position.y = 4.4; stem.add(joint);
let bowl = joint;
if (S.bowl) {
  const grom = new THREE.Mesh(new THREE.CylinderGeometry(2.0, 2.0, 1.0, 48), new THREE.MeshStandardMaterial({ color: 0x1d1d22, roughness: 0.8 }));
  grom.position.y = 6.4; stem.add(grom);
  const bowlPts = [new THREE.Vector2(1.2, 0), new THREE.Vector2(2.0, 0.6), new THREE.Vector2(3.6, 3.2), new THREE.Vector2(4.0, 5.0), new THREE.Vector2(3.7, 5.2), new THREE.Vector2(3.3, 3.8), new THREE.Vector2(1.6, 1.0)];
  const bowlMat = new THREE.MeshPhysicalMaterial({ map: gradTex(S.bowl), roughness: 0.12, clearcoat: 1, side: THREE.DoubleSide });
  bowl = new THREE.Mesh(new THREE.LatheGeometry(bowlPts, 64), bowlMat); bowl.position.y = 7; bowl.scale.setScalar(0.85 * (S.bowlScale || 1)); stem.add(bowl);
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * 6.283, d = new THREE.Mesh(new THREE.SphereGeometry(0.45, 20, 14), glass({ color: col(S.dotColor || 0xfff6c8), opacity: 0.6 }));
    const k = S.bowlScale || 1; d.scale.setScalar(k); d.position.set(Math.cos(a) * 3.75 * k, 7 + (3.4 + (i % 2) * 0.8) * k, Math.sin(a) * 3.75 * k); stem.add(d);
  }
} else {
  const lip = new THREE.Mesh(new THREE.TorusGeometry(2.25, 0.45, 20, 48), glass({ color: col(S.jointColor), opacity: 0.6 }));
  lip.rotation.x = Math.PI / 2; lip.position.y = 6.1; stem.add(lip);
}

// floor shadow + light
const floor = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), new THREE.ShadowMaterial({ opacity: 0.22 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -50, right: 50, top: 50, bottom: -50 }); key.position.set(40, 140, 60); scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 0.6));

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 700);
const TY = H * 0.483, HOME = { pos: new THREE.Vector3(0, TY - 10 * H / 112, 250), tgt: new THREE.Vector3(0, TY, 0) };
const homeD = () => Math.max(260 * H / 112, fit(C.width * 1.55, H * 1.145));
const fitHome = () => { HOME.pos.set(0, TY - 10 * H / 112, homeD()); };
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.tgt); controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.autoRotate = true; controls.autoRotateSpeed = 1.2;
controls.minDistance = 3; controls.maxDistance = 600;
controls.zoomToCursor = true; controls.zoomSpeed = 1.1; controls.screenSpacePanning = true;
let tween = null;
controls.addEventListener('start', () => { controls.autoRotate = false; tween = null; });

// --- smooth camera moves
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function flyTo(pos, tgt, ms = 900) {
  controls.autoRotate = false;
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: tgt.clone(), start: performance.now(), ms };
}
function stepTween(now) {
  if (!tween) return;
  const k = Math.min(1, (now - tween.start) / tween.ms), e = ease(k);
  camera.position.lerpVectors(tween.p0, tween.p1, e);
  controls.target.lerpVectors(tween.t0, tween.t1, e);
  if (k >= 1) tween = null;
}
function closeOn(point, d, from) {
  const dir = (from ? from.clone() : camera.position.clone().sub(point)).normalize();
  flyTo(point.clone().add(dir.multiplyScalar(d)), point);
}
// distance at which a w x h cm patch fills the screen (narrow phones are limited by width)
function fit(w, h) {
  const v = THREE.MathUtils.degToRad(camera.fov) / 2, hz = Math.atan(Math.tan(v) * camera.aspect);
  return 1.08 * Math.max(h / 2 / Math.tan(v), w / 2 / Math.tan(hz));
}
fitHome(); camera.position.copy(HOME.pos);
const dist = () => camera.position.distanceTo(controls.target);
function dolly(f) {
  const d = THREE.MathUtils.clamp(dist() * f, controls.minDistance, controls.maxDistance);
  const dir = camera.position.clone().sub(controls.target).normalize();
  flyTo(controls.target.clone().add(dir.multiplyScalar(d)), controls.target.clone(), 450);
}
const bar = document.querySelector('.bar');
function setOn(b) { bar.querySelectorAll('[data-spot]').forEach((x) => x.classList.toggle('on', x === b)); }
const home = () => { fitHome(); flyTo(HOME.pos, HOME.tgt); setOn(null); };

// --- detail spots
scene.updateMatrixWorld(true);
const mc = MARB.reduce((a, v) => a.add(v), new THREE.Vector3()).divideScalar(Math.max(1, MARB.length));
const mOut = new THREE.Vector3(mc.x, 0, mc.z).normalize();
const span = MARB.length ? Math.max(...MARB.map((v) => v.y)) - Math.min(...MARB.map((v) => v.y)) : 0;
const bowlAt = new THREE.Vector3(); bowl.getWorldPosition(bowlAt);
const bowlDir = new THREE.Vector3(Math.sin(THREE.MathUtils.degToRad(S.deg)), 0.32, Math.cos(THREE.MathUtils.degToRad(S.deg))).normalize();
const SPOTS = {
  marbles: () => closeOn(mc.clone(), fit(Math.max(14, span * 1.1), Math.max(16, span * 1.6)), mOut.clone().add(new THREE.Vector3(0, 0.1, 0))),
  crown: () => {
    const t = new THREE.Vector3(0, bandY - 0.6, 0);
    const s = camera.position.clone().sub(t); s.y = 0; if (s.lengthSq() < 1e-4) s.set(0, 0, 1);
    closeOn(t, fit(bandR * 3.2, bandH * 2.2), s.normalize().add(new THREE.Vector3(0, 0.22, 0)));
  },
  bowl: () => closeOn(bowlAt.clone().add(new THREE.Vector3(0, S.bowl ? 2.5 : 0, 0)), fit(14, 14), S.bowl ? bowlDir.clone().add(new THREE.Vector3(0.35, 0, 0.2)) : bowlDir),
};
bar.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'zIn') dolly(0.6);
  else if (b.id === 'zOut') dolly(1.6);
  else if (b.id === 'zReset') home();
  else if (b.dataset.spot) { SPOTS[b.dataset.spot](); setOn(b); }
});

// --- double-tap / double-click: fly in to that point, keep tapping to go closer, at the closest it backs out
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pickables = [];
piece.traverse((o) => { if (o.isMesh && !(o.material && o.material.isShaderMaterial)) pickables.push(o); });
function zoomAt(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  setOn(null);
  if (!hit) { home(); return; }
  const d = dist();
  const first = fit(20, 20), last = fit(4, 4);
  if (d > first * 1.2) closeOn(hit.point, first);
  else if (d > last * 1.15) closeOn(hit.point, Math.max(last, d * 0.45));
  else home();
}
let lastTap = null, down = null;
const el = renderer.domElement;
el.addEventListener('pointerdown', (e) => { if (e.isPrimary) down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
el.addEventListener('pointerup', (e) => {
  if (!e.isPrimary || !down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), held = performance.now() - down.t;
  down = null;
  if (moved > 12 || held > 350) { lastTap = null; return; }
  const now = performance.now();
  if (lastTap && now - lastTap.t < 340 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) { lastTap = null; zoomAt(e.clientX, e.clientY); }
  else lastTap = { x: e.clientX, y: e.clientY, t: now };
});
el.addEventListener('dblclick', (e) => e.preventDefault());

// keep marbles crisp up close: render at full device resolution when zoomed in
let pr = 0;
function sharpen() {
  const want = Math.min(devicePixelRatio, dist() < fit(30, 30) ? 3 : 2);
  if (want !== pr) { pr = want; renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight); }
}

window.__view = (az, d, ty = TY, el = 5) => { controls.autoRotate = false; tween = null; d = d || homeD(); const a = THREE.MathUtils.degToRad(az); camera.position.set(Math.sin(a) * d, ty + el, Math.cos(a) * d); controls.target.set(0, ty, 0); controls.update(); };
window.__spot = (k) => SPOTS[k]();
window.__zoomAt = zoomAt;
window.__busy = () => !!tween;

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); fitHome(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop((now) => { stepTween(now); controls.update(); sharpen(); renderer.render(scene, camera); });
window.__ready = true;
</script></body></html>
