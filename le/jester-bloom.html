<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jester Bloom (LE), 3D test</title>
<style>
:root{--bg-top:#f4f4f6;--bg-bottom:#cfd0d6;--text:#1d1d22;--muted:#5d5d66}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg-top:#3a3a40;--bg-bottom:#141418;--text:#ececf0;--muted:#a3a3ad}}
:root[data-theme="dark"]{--bg-top:#3a3a40;--bg-bottom:#141418;--text:#ececf0;--muted:#a3a3ad}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg-bottom);background-image:radial-gradient(ellipse at 50% 35%,var(--bg-top) 0%,var(--bg-bottom) 80%);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:absolute;top:0;left:0;right:0;padding:14px 16px 0;text-align:center;pointer-events:none;z-index:2}
h1{margin:0;font-size:1.15rem;font-weight:650}
p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.16);z-index:3;max-width:calc(100vw - 24px)}
.bar button{font:600 14px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border:0;border-radius:999px;background:#fff;color:#1d1d22;min-width:44px;height:44px;padding:0 14px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);white-space:nowrap}
.bar button.ic{padding:0;font-size:20px}
.bar button.on{background:#233671;color:#fff;box-shadow:none}
.bar .sep{width:1px;height:26px;background:rgba(0,0,0,.14);margin:0 2px}
@media (max-width:420px){.bar{gap:4px;padding:5px}.bar button{padding:0 10px;font-size:13px;height:42px}.bar button.ic{min-width:40px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar{background:rgba(30,30,36,.82)}:root:not([data-theme="light"]) .bar button{background:#2b2b33;color:#ececf0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}:root:not([data-theme="light"]) .bar button.on{background:#FCD804;color:#111}:root:not([data-theme="light"]) .bar .sep{background:rgba(255,255,255,.18)}}
</style>

const piece = new THREE.Group(); scene.add(piece);
const tex = (src) => { const t = new THREE.TextureLoader().load(src); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const col = (c) => new THREE.Color(c);
const OUT = C.outer.slice().sort((a, b) => a[0] - b[0]);
function rAt(f) {
  for (let i = 0; i < OUT.length - 1; i++) { const [f0, r0] = OUT[i], [f1, r1] = OUT[i + 1]; if (f >= f0 && f <= f1) return f1 === f0 ? r0 : r0 + (r1 - r0) * (f - f0) / (f1 - f0); }
  return OUT[OUT.length - 1][1];
}

// body: foot centre, the outside up to the lip, then a short way back down inside the mouth
const prof = C.outer.slice().sort((a, b) => b[0] - a[0]);
const pts = [[1, 0.001], ...prof, [0, C.lipIn], [0.012, C.lipIn * 0.97]].map(([f, r]) => new THREE.Vector2(Math.max(0.001, r), Y(f)));
const bodyGeo = new THREE.LatheGeometry(pts, 192);
{ // v = photo row (by height), u = angle. The texture is the front half; s = 2u + 0.5, mirrored round the back.
  const p = bodyGeo.attributes.position, uv = bodyGeo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setY(i, Math.min(1, Math.max(0, p.getY(i) / H)));
}
const bodyTex = tex(T.body);
// full360: the texture is the whole way round (front photo + side photo, each mirrored round to its opposite side,
// blended by facing), its middle column the front, the seam at the back. Otherwise: the front half, mirrored round the back.
if (C.full360) { bodyTex.wrapS = THREE.RepeatWrapping; bodyTex.repeat.set(1, 1); bodyTex.offset.set(0.5, 0); }
else { bodyTex.wrapS = THREE.MirroredRepeatWrapping; bodyTex.repeat.set(2, 1); bodyTex.offset.set(0.5, 0); }
const bodyMat = new THREE.MeshPhysicalMaterial({ map: bodyTex, emissiveMap: bodyTex, emissive: col(0xffffff), emissiveIntensity: C.selfLit ?? 0.5,
  roughness: 0.1, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03, specularIntensity: 0.5, envMapIntensity: C.env ?? 0.45, side: THREE.DoubleSide });
if (C.toneMapped === false) bodyMat.toneMapped = false;  // keep the photo's own colours (ACES washes them out)
if (C.albedo != null) bodyMat.color = new THREE.Color(C.albedo, C.albedo, C.albedo);  // the photo already has its light in it
const body = new THREE.Mesh(bodyGeo, bodyMat); body.castShadow = true; piece.add(body);
// a glassy rim light along the silhouette
{
  const e = new THREE.Mesh(bodyGeo, new THREE.ShaderMaterial({ transparent: true, depthWrite: false,
    uniforms: { c: { value: col(C.edge || 0xffffff) }, k: { value: 0.3 } },
    vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'uniform vec3 c; uniform float k; varying vec3 vN; varying vec3 vV; void main(){ float r = 1. - abs(dot(normalize(vN), normalize(vV))); gl_FragColor = vec4(c, k * pow(r, 3.0)); }' }));
  e.scale.set(1.004, 1, 1.004); piece.add(e);
}

// marbles / lumps that break the silhouette: a sphere each, its own photo crop on the face toward the camera
const MARB = [];
for (const M of C.marbles) {
  const a = THREE.MathUtils.degToRad(M.deg), y = Y(M.f), r = rAt(M.f), dia = M.dia;
  const g = new THREE.SphereGeometry(dia / 2, 48, 36);
  const p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / dia + 0.5, p.getY(i) / dia + 0.5);
  const t = tex(T[M.tex]);
  const m = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ map: t, emissiveMap: t, emissive: col(0xffffff), emissiveIntensity: C.albedo != null ? C.selfLit : 0.45,
    color: C.albedo != null ? new THREE.Color(C.albedo * 2, C.albedo * 2, C.albedo * 2) : col(0xffffff),
    roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.01, envMapIntensity: 0.7, toneMapped: C.toneMapped !== false }));
  const out = r + M.out;
  m.position.set(Math.sin(a) * out, y, Math.cos(a) * out);
  // the crop was seen from the camera at azimuth M.face (0 = the front photo): point the textured face at that camera,
  // turned part way toward the marble's own side
  { const fa = THREE.MathUtils.degToRad(M.face || 0), rel = Math.sin(a - fa) * 0.5;
    m.lookAt(m.position.x + Math.sin(fa) + Math.cos(fa) * rel, y, m.position.z + Math.cos(fa) - Math.sin(fa) * rel); }
  m.castShadow = true; piece.add(m); MARB.push(m.position.clone());
}
// the bowl + its joint (only seen in the side photo): a small lathe of its own along the stem's axis, wrapped with
// the side photo's crop (front half, mirrored round), its photographed face toward that camera
if (C.bowlPart && T.bowl) {
  const B = C.bowlPart;
  const g = new THREE.LatheGeometry(B.outer.map(([t, r]) => new THREE.Vector2(Math.max(0.02, r), t * B.len)), 64);
  { const uv = g.attributes.uv, p = g.attributes.position; for (let i = 0; i < p.count; i++) uv.setY(i, p.getY(i) / B.len); }
  const bt = tex(T.bowl); bt.wrapS = THREE.MirroredRepeatWrapping; bt.repeat.set(2, 1); bt.offset.set(0.5, 0);
  const mat = new THREE.MeshPhysicalMaterial({ map: bt, emissiveMap: bt, emissive: col(0xffffff), emissiveIntensity: C.selfLit ?? 0.5,
    roughness: 0.1, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: C.env ?? 0.45, side: THREE.DoubleSide });
  if (C.toneMapped === false) mat.toneMapped = false;
  if (C.albedo != null) mat.color = new THREE.Color(C.albedo, C.albedo, C.albedo);
  const m = new THREE.Mesh(g, mat);
  const Yd = new THREE.Vector3(...B.dir).normalize(), Zc = new THREE.Vector3(...B.cam);
  const Zd = Zc.sub(Yd.clone().multiplyScalar(Zc.dot(Yd))).normalize(), Xd = new THREE.Vector3().crossVectors(Yd, Zd);
  m.matrix.makeBasis(Xd, Yd, Zd); m.matrix.setPosition(B.base[0], B.base[1], B.base[2]); m.matrixAutoUpdate = false;
  m.castShadow = true; piece.add(m);
}
const bandY = Y((C.crown[0] + C.crown[1]) / 2), bandH = (C.crown[1] - C.crown[0]) * H, bandR = rAt((C.crown[0] + C.crown[1]) / 2);
const BULB = { y: Y(C.bulb[0]), r: C.bulb[1] };
const S = { deg: 0 };
const bowl = body;

// floor shadow + light
const floor = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.ShadowMaterial({ opacity: 0.22 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 4; key.shadow.bias = -0.0005;
{ const s = Math.max(60, H * 0.9); Object.assign(key.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 1, far: H * 6 }); }
key.position.set(H * 0.3, H * 2.2, H * 0.45); key.target.position.set(0, 0, 0); scene.add(key, key.target);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 0.6));

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 700);
const TY = H * 0.49, HOME = { pos: new THREE.Vector3(0, TY - 10 * H / 112, 250), tgt: new THREE.Vector3(0, TY, 0) };
const homeD = () => fit(C.width * 1.6, H * 1.16);
const fitHome = () => { HOME.pos.set(0, TY - 10 * H / 112, homeD()); };
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.tgt); controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.autoRotate = true; controls.autoRotateSpeed = 1.2;
controls.minDistance = 2; controls.maxDistance = 300;
controls.zoomToCursor = true; controls.zoomSpeed = 1.1; controls.screenSpacePanning = true;
let tween = null;
controls.addEventListener('start', () => { controls.autoRotate = false; tween = null; });

// --- smooth camera moves
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function flyTo(pos, tgt, ms = 900) {
  controls.autoRotate = false;
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: tgt.clone(), start: performance.now(), ms };
}
function stepTween(now) {
  if (!tween) return;
  const k = Math.min(1, (now - tween.start) / tween.ms), e = ease(k);
  camera.position.lerpVectors(tween.p0, tween.p1, e);
  controls.target.lerpVectors(tween.t0, tween.t1, e);
  if (k >= 1) tween = null;
}
function closeOn(point, d, from) {
  const dir = (from ? from.clone() : camera.position.clone().sub(point)).normalize();
  flyTo(point.clone().add(dir.multiplyScalar(d)), point);
}
// distance at which a w x h cm patch fills the screen (narrow phones are limited by width)
function fit(w, h) {
  const v = THREE.MathUtils.degToRad(camera.fov) / 2, hz = Math.atan(Math.tan(v) * camera.aspect);
  return 1.08 * Math.max(h / 2 / Math.tan(v), w / 2 / Math.tan(hz));
}
fitHome(); camera.position.copy(HOME.pos);
const dist = () => camera.position.distanceTo(controls.target);
function dolly(f) {
  const d = THREE.MathUtils.clamp(dist() * f, controls.minDistance, controls.maxDistance);
  const dir = camera.position.clone().sub(controls.target).normalize();
  flyTo(controls.target.clone().add(dir.multiplyScalar(d)), controls.target.clone(), 450);
}
const bar = document.querySelector('.bar');
function setOn(b) { bar.querySelectorAll('[data-spot]').forEach((x) => x.classList.toggle('on', x === b)); }
const home = () => { fitHome(); flyTo(HOME.pos, HOME.tgt); setOn(null); };

// --- detail spots
scene.updateMatrixWorld(true);
const mc = MARB.reduce((a, v) => a.add(v), new THREE.Vector3()).divideScalar(Math.max(1, MARB.length));
const mOut = new THREE.Vector3(mc.x, 0, mc.z).normalize();
const span = MARB.length ? Math.max(...MARB.map((v) => v.y)) - Math.min(...MARB.map((v) => v.y)) : 0;
const SPOTS = {
  marbles: () => C.focus ? closeOn(new THREE.Vector3(C.focus[2], Y(C.focus[0]), 0), fit(Math.max(7, C.focus[1] * H * 1.3), Math.max(8, C.focus[1] * H * 1.7)), new THREE.Vector3(Math.sign(C.focus[2]) * 0.35, 0.12, 1).normalize()) : SPOTS.crown(),
  crown: () => closeOn(new THREE.Vector3(0, bandY, 0), fit(bandR * 3.4, Math.max(bandH * 1.8, bandR * 3)), new THREE.Vector3(-0.12, 0.18, 1).normalize()),
  bowl: () => closeOn(new THREE.Vector3(0, BULB.y, 0), fit(BULB.r * 2.6, BULB.r * 2.6), new THREE.Vector3(0.1, 0.25, 1).normalize()),
};
bar.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'zIn') dolly(0.6);
  else if (b.id === 'zOut') dolly(1.6);
  else if (b.id === 'zReset') home();
  else if (b.dataset.spot) { SPOTS[b.dataset.spot](); setOn(b); }
});

// --- double-tap / double-click: fly in to that point, keep tapping to go closer, at the closest it backs out
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pickables = [];
piece.traverse((o) => { if (o.isMesh && !(o.material && o.material.isShaderMaterial)) pickables.push(o); });
function zoomAt(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  setOn(null);
  if (!hit) { home(); return; }
  const d = dist();
  const first = fit(10, 10), last = fit(2.5, 2.5);
  if (d > first * 1.2) closeOn(hit.point, first);
  else if (d > last * 1.15) closeOn(hit.point, Math.max(last, d * 0.45));
  else home();
}
let lastTap = null, down = null;
const el = renderer.domElement;
el.addEventListener('pointerdown', (e) => { if (e.isPrimary) down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
el.addEventListener('pointerup', (e) => {
  if (!e.isPrimary || !down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), held = performance.now() - down.t;
  down = null;
  if (moved > 12 || held > 350) { lastTap = null; return; }
  const now = performance.now();
  if (lastTap && now - lastTap.t < 340 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) { lastTap = null; zoomAt(e.clientX, e.clientY); }
  else lastTap = { x: e.clientX, y: e.clientY, t: now };
});
el.addEventListener('dblclick', (e) => e.preventDefault());

// keep marbles crisp up close: render at full device resolution when zoomed in
let pr = 0;
function sharpen() {
  const want = Math.min(devicePixelRatio, dist() < fit(12, 12) ? 3 : 2);
  if (want !== pr) { pr = want; renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight); }
}

window.__view = (az, d, ty = TY, el = 5) => { controls.autoRotate = false; tween = null; d = d || homeD(); const a = THREE.MathUtils.degToRad(az); camera.position.set(Math.sin(a) * d, ty + el, Math.cos(a) * d); controls.target.set(0, ty, 0); controls.update(); };
window.__spot = (k) => SPOTS[k]();
window.__zoomAt = zoomAt;
window.__busy = () => !!tween;

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); fitHome(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop((now) => { stepTween(now); controls.update(); sharpen(); renderer.render(scene, camera); });
window.__ready = true;
</script></body></html>
